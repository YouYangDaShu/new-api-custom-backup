root = "."
tmp_dir = ".devdata/tmp"

[build]
  bin = ".devdata/new-api"
  cmd = "go build -o .devdata/new-api ."
  delay = 1000
  exclude_dir = [".devdata", "web/default/node_modules", "web/classic/node_modules", "electron/node_modules", "audit-artifacts"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "500ms"

[log]
  time = true

[misc]
  clean_on_exit = true
